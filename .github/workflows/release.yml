name: Release

# A tag that starts with v checks the version, runs the tests and drafts a GitHub release.
# It publishes nothing else: a person reads the draft and presses Publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: plugins/frc/uv.lock
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Lock file matches pyproject.toml
        run: uv lock --check --project plugins/frc
      - name: Install
        run: uv sync --project plugins/frc --group dev --frozen --python 3.13
      - name: Versions match everywhere
        run: uv run --project plugins/frc --group dev --python 3.13 python -m pytest -q tests/test_versions.py
      - name: Tag matches the plugin version
        run: |
          python3 - <<'PY'
          import json, os, sys
          version = json.load(open("plugins/frc/.claude-plugin/plugin.json", encoding="utf-8"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + version:
              sys.exit(f"tag {tag} does not match plugin version v{version}")
          PY
      - name: Marketplace pins this tag
        run: |
          python3 - <<'PY'
          import json, os, sys
          entry = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))["plugins"][0]
          tag = os.environ["GITHUB_REF_NAME"]
          if entry["source"].get("ref") != tag:
              sys.exit(f"marketplace ref {entry['source'].get('ref')} does not match tag {tag}")
          PY
      - name: Run tests
        run: uv run --project plugins/frc --group dev --python 3.13 python -m pytest -q -p no:cacheprovider

  draft-release:
    name: Draft GitHub release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Notes from CHANGELOG.md
        run: python3 .github/scripts/changelog_section.py CHANGELOG.md "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --notes-file release-notes.md --verify-tag --title "$GITHUB_REF_NAME"
