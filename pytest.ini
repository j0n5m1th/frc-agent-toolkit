[pytest]
asyncio_mode = auto
addopts = --basetemp=pytest-output
# addopts: a fixed project-local temp root instead of pytest-of-<user>
# pythonpath: the only list of extra import roots. The evaluation scripts import each other as plain scripts, and
# tests/common holds the helpers other folders share.
pythonpath = evaluations tests/common
testpaths = tests
markers =
    slow: waits on real time or the real network for several seconds (still in the default run; skip with -m "not slow")
