[project]
name = "frc-mcp-wpilog"
version = "0.1.0"
description = "MCP server for recorded .wpilog files"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "pydantic>=2.7,<3",
    "robotpy-wpiutil>=2026.2.2",  # `wpiutil.log`, read directly by the log server (not just via pyntcore)
    "frc-mcp-core",
    "frc-mcp-wpilib",
]

[project.scripts]
# The old per-server command name: an alias for one release, drop it next release. `frc-mcp wpilog` replaces it.
mcp-wpilib-wpilog = "frc_mcp_wpilog.spec:main"

[project.entry-points."frc_mcp.servers"]
wpilog = "frc_mcp_wpilog.spec:SPEC"

[project.entry-points."frc_mcp.demos"]
log = "frc_mcp_wpilog.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_wpilog"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
frc-mcp-wpilib = { workspace = true }
