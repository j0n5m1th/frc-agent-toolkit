[project]
name = "frc-mcp-vscode"
version = "0.1.0"
description = "MCP server for WPILib VS Code commands"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "pydantic>=2.7,<3",
    "frc-mcp-core",
    "frc-mcp-wpilib",
]

[project.scripts]
# The old per-server command name: an alias for one release, drop it next release. `frc-mcp vscode` replaces it.
mcp-wpilib-vscode = "frc_mcp_vscode.spec:main"

[project.entry-points."frc_mcp.servers"]
vscode = "frc_mcp_vscode.spec:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_vscode"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
frc-mcp-wpilib = { workspace = true }
