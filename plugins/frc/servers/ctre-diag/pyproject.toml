[project]
name = "frc-mcp-ctre-diag"
version = "0.1.0"
description = "MCP server for the Phoenix Diagnostic Server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "pydantic>=2.7,<3",
    "frc-mcp-core",
    "frc-mcp-ctre",
    "frc-mcp-systemcore-common",
]

[project.scripts]
# The old per-server command name: an alias for one release, drop it next release. `frc-mcp ctre-diag` replaces it.
mcp-ctre-diag = "frc_mcp_ctre_diag.spec:main"

[project.entry-points."frc_mcp.servers"]
ctre-diag = "frc_mcp_ctre_diag.spec:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_ctre_diag"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
frc-mcp-ctre = { workspace = true }
frc-mcp-systemcore-common = { workspace = true }
