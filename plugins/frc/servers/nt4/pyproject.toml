[project]
name = "frc-mcp-nt4"
version = "0.1.0"
description = "Live NetworkTables 4 MCP server for FRC robots"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "msgpack>=1.2.3",
    "pydantic>=2.7,<3",
    "pyntcore>=2026.2.2",
    "frc-mcp-core",
    "frc-mcp-wpilib",
]

[project.scripts]
# The old per-server command name: an alias for one release, drop it next release. `frc-mcp nt4` replaces it.
mcp-wpilib-nt4 = "frc_mcp_nt4.spec:main"

[project.entry-points."frc_mcp.servers"]
nt4 = "frc_mcp_nt4.spec:SPEC"

[project.entry-points."frc_mcp.demos"]
robot = "frc_mcp_nt4.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_nt4"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
frc-mcp-wpilib = { workspace = true }
