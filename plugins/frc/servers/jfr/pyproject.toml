[project]
name = "frc-mcp-jfr"
version = "0.1.0"
description = "MCP server for Java profiling with JFR"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "pydantic>=2.7,<3",
    "frc-mcp-core",
]

[project.scripts]
# The old per-server command name: an alias for one release, drop it next release. `frc-mcp jfr` replaces it.
mcp-jfr = "frc_mcp_jfr.spec:main"

[project.entry-points."frc_mcp.servers"]
jfr = "frc_mcp_jfr.spec:SPEC"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_jfr"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
