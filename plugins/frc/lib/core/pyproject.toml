[project]
name = "frc-mcp-core"
version = "0.1.0"
description = "Shared server setup and command line for the FRC MCP servers"
requires-python = ">=3.13"
dependencies = [
    "fastmcp-slim[client,server]>=4.1.3,<5",  # the `fastmcp` metapackage is exactly these two extras
    "pydantic>=2.7,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_core"]
