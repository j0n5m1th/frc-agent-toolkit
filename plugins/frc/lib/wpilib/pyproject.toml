[project]
name = "frc-mcp-wpilib"
version = "0.1.0"
description = "Code shared by the WPILib MCP servers"
requires-python = ">=3.13"
dependencies = [
    "msgpack>=1.2.3",
    "protobuf>=7",
    "pydantic>=2.7,<3",
    "frc-mcp-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_wpilib"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
