[project]
name = "frc-mcp-ctre"
version = "0.1.0"
description = "CTRE tool index, installs and project facts shared by the CTRE MCP servers"
requires-python = ">=3.13"
dependencies = [
    "frc-mcp-core",
    "frc-mcp-wpilib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frc_mcp_ctre"]

[tool.uv.sources]
frc-mcp-core = { workspace = true }
frc-mcp-wpilib = { workspace = true }
